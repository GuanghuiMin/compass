[project]
name = "compass"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = ["appworld==0.1.3.post1", "openai", "tiktoken", "jinja2", "networkx", "python-dotenv"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
